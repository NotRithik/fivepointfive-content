name: Check and publish content
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: content-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test scripts/schema.test.mjs
      - run: node scripts/build.mjs
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/build.mjs
      - name: Publish one complete validated snapshot
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'A newer edit exists. Its workflow will publish; this older edit is skipped.'
            exit 0
          fi
          git fetch origin published
          git worktree add --detach "$RUNNER_TEMP/website-content" origin/published
          cp build/content.json "$RUNNER_TEMP/website-content/content.json"
          cd "$RUNNER_TEMP/website-content"
          git config user.name '5.5 Content Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish validated content from ${GITHUB_SHA:0:12}"
          git push origin HEAD:published
          echo 'Published. Refresh the website after GitHub raw-file caching clears.' >> "$GITHUB_STEP_SUMMARY"
